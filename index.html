<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearl Mini Emulator — SOVDA</title>
<meta name="description" content="A browser emulator of the SOVDA Pearl Mini colour sorter HMI, for training and familiarisation.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Reusable icon definitions -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Operator / supervisor person -->
    <symbol id="i-person" viewBox="0 0 64 64">
      <circle cx="32" cy="17" r="11" fill="currentColor"/>
      <path d="M10 56c0-12 10-20 22-20s22 8 22 20z" fill="currentColor"/>
      <path d="M32 36l-7 20h14z" fill="#f4f4f4"/>
      <path d="M32 36l-4 6 4 5 4-5z" fill="#2b2b2b"/>
    </symbol>
    <!-- Floppy save -->
    <symbol id="i-floppy" viewBox="0 0 64 64">
      <rect x="6" y="8" width="52" height="48" rx="4" fill="#2f9fe0"/>
      <rect x="16" y="8" width="32" height="20" fill="#eaf6ff"/>
      <rect x="38" y="11" width="7" height="14" fill="#2b6f9e"/>
      <rect x="14" y="34" width="36" height="22" rx="2" fill="#eaf6ff"/>
      <path d="M40 34h18v22H40z" fill="#3fbf4a"/>
      <path d="M49 38v10m0 0l-4-4m4 4l4-4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
    <!-- Green back arrow -->
    <symbol id="i-back" viewBox="0 0 64 64">
      <path d="M34 14C16 14 10 30 10 44c0-8 10-13 24-13v11l20-16-20-16z"
            fill="#5ec22a"/>
    </symbol>
    <!-- Network -->
    <symbol id="i-network" viewBox="0 0 64 64">
      <rect x="6" y="30" width="22" height="16" rx="2" fill="#2f6f9e"/>
      <rect x="30" y="14" width="22" height="16" rx="2" fill="#3fa3d8"/>
      <rect x="34" y="40" width="22" height="16" rx="2" fill="#3fa3d8"/>
      <path d="M28 38h8v-16h-4M28 42h8v10h-4" stroke="#9ec8e0" stroke-width="2.5" fill="none"/>
    </symbol>
    <!-- Telephone -->
    <symbol id="i-phone" viewBox="0 0 64 64">
      <rect x="8" y="34" width="48" height="20" rx="4" fill="#2f7fb8"/>
      <path d="M12 34c0-14 8-22 20-22s20 8 20 22" stroke="#6fc0e8" stroke-width="7" fill="none"/>
      <circle cx="20" cy="44" r="4" fill="#0d3550"/><circle cx="32" cy="44" r="4" fill="#0d3550"/>
      <circle cx="44" cy="44" r="4" fill="#0d3550"/>
    </symbol>
    <!-- Notepad / history -->
    <symbol id="i-notepad" viewBox="0 0 64 64">
      <rect x="10" y="12" width="38" height="44" rx="3" fill="#f0f0f0"/>
      <path d="M16 22h26M16 30h26M16 38h18" stroke="#8a8a8a" stroke-width="3"/>
      <path d="M40 44l14-14 6 6-14 14-8 2z" fill="#e0a020"/>
      <path d="M38 52l8-2-6-6z" fill="#333"/>
    </symbol>
    <!-- File / folder search -->
    <symbol id="i-file" viewBox="0 0 64 64">
      <path d="M6 16h20l5 6h27v34H6z" fill="#e8a93a"/>
      <path d="M6 26h52v30H6z" fill="#f5c96a"/>
      <circle cx="38" cy="38" r="11" fill="none" stroke="#2b2b2b" stroke-width="4"/>
      <path d="M46 46l9 9" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <!-- Chart / feed settings -->
    <symbol id="i-chart" viewBox="0 0 64 64">
      <rect x="12" y="30" width="10" height="26" rx="3" fill="#5ec22a"/>
      <rect x="27" y="18" width="10" height="38" rx="3" fill="#3fa3d8"/>
      <rect x="42" y="8"  width="10" height="48" rx="3" fill="#e03a3a"/>
    </symbol>
    <!-- Cleaning cycle -->
    <symbol id="i-clean" viewBox="0 0 64 64">
      <path d="M10 26h36l-8-8M54 40H18l8 8" stroke="currentColor" stroke-width="7"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Data same (blue down arrows) -->
    <symbol id="i-datasame" viewBox="0 0 64 64">
      <path d="M14 16v18l-6-2 10 16 10-16-6 2V16z" fill="#2f9fe0"/>
      <path d="M40 16v18l-6-2 10 16 10-16-6 2V16z" fill="#2f9fe0"/>
    </symbol>
    <!-- View image -->
    <symbol id="i-viewimg" viewBox="0 0 64 64">
      <circle cx="28" cy="28" r="17" fill="#bfe4f5" stroke="#2f7fb8" stroke-width="4"/>
      <circle cx="28" cy="28" r="7" fill="#e07a2a"/>
      <path d="M41 41l14 14" stroke="#2f7fb8" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- Start (blue down arrow) -->
    <symbol id="i-start" viewBox="0 0 64 64">
      <path d="M24 8h16v26h12L32 56 12 34h12z" fill="#2f9fe0"/>
    </symbol>
    <!-- Stop -->
    <symbol id="i-stop" viewBox="0 0 64 64">
      <rect x="14" y="14" width="36" height="36" rx="4" fill="#e03a3a"/>
    </symbol>
    <!-- Menu grid -->
    <symbol id="i-menu" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#1b4e70" stroke="#5fc2f0" stroke-width="3"/>
      <g fill="#fff">
        <circle cx="22" cy="22" r="3.4"/><circle cx="32" cy="22" r="3.4"/><circle cx="42" cy="22" r="3.4"/>
        <circle cx="22" cy="32" r="3.4"/><circle cx="32" cy="32" r="3.4"/><circle cx="42" cy="32" r="3.4"/>
        <circle cx="22" cy="42" r="3.4"/><circle cx="32" cy="42" r="3.4"/><circle cx="42" cy="42" r="3.4"/>
      </g>
    </symbol>
    <!-- Power off -->
    <symbol id="i-power" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#1b4e70" stroke="#5fc2f0" stroke-width="3"/>
      <circle cx="32" cy="32" r="22" fill="#7a8a92"/>
      <path d="M32 16v18" stroke="#1b6fa8" stroke-width="6" stroke-linecap="round"/>
      <path d="M21 23a15 15 0 1 0 22 0" stroke="#1b6fa8" stroke-width="6" fill="none" stroke-linecap="round"/>
    </symbol>

    <!-- ===== Menu tile icons (glossy tiles, per the real 3x3 menu) ===== -->
    <symbol id="t-sensitivity" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <rect x="16" y="16" width="32" height="32" rx="3" fill="none" stroke="#e8e8f2" stroke-width="2"/>
      <path d="M23 20v24M32 20v24M41 20v24" stroke="#e8e8f2" stroke-width="2.4"/>
      <rect x="19.5" y="27" width="7" height="5" rx="1.5" fill="#fff"/>
      <rect x="28.5" y="35" width="7" height="5" rx="1.5" fill="#fff"/>
      <rect x="37.5" y="23" width="7" height="5" rx="1.5" fill="#fff"/>
    </symbol>
    <symbol id="t-clean" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M17 26h24l-7-7M47 38H23l7 7" stroke="#fff" stroke-width="5"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-feed" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <rect x="17" y="32" width="8" height="16" rx="2.5" fill="#5ec22a"/>
      <rect x="28" y="24" width="8" height="24" rx="2.5" fill="#3fa3d8"/>
      <rect x="39" y="16" width="8" height="32" rx="2.5" fill="#e03a3a"/>
    </symbol>
    <symbol id="t-file" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M14 20h14l4 5h18v22H14z" fill="#e8a93a"/>
      <path d="M14 27h38v20H14z" fill="#f5c96a"/>
      <circle cx="35" cy="35" r="8" fill="none" stroke="#2b2b2b" stroke-width="3"/>
      <path d="M41 41l6 6" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="t-ai" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M32 14l14 8v20l-14 8-14-8V22z" fill="none" stroke="#e8e8f2" stroke-width="2.4"/>
      <text x="32" y="39" font-family="Helvetica, Arial, sans-serif" font-size="17"
            font-weight="600" fill="#fff" text-anchor="middle">AI</text>
    </symbol>
    <symbol id="t-valve" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M46 32a14 14 0 1 1-5-10.7" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M46 15v9h-9" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 24v9l6 4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-camera" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <circle cx="32" cy="32" r="15" fill="#1b2535" stroke="#cfd6e2" stroke-width="2"/>
      <circle cx="32" cy="32" r="9" fill="#2a5d8f"/>
      <circle cx="32" cy="32" r="4.5" fill="#7fd4ff"/>
      <circle cx="27" cy="27" r="2.4" fill="#ffffff" opacity="0.85"/>
    </symbol>
    <symbol id="t-bgplate" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M14 40c8-16 14-16 18-8s10 8 18-8v14c-8 16-14 16-18 8s-10-8-18 8z" fill="url(#waveGrad)"/>
    </symbol>
    <symbol id="t-system" viewBox="0 0 64 64">
      <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#tileGrad)" stroke="#b9b9c4" stroke-width="2"/>
      <path d="M32 20l3.4 1.1 2.7-2.2 2.6 2.4-1.4 3.2 1.9 2.9 3.5.3.6 3.5-3.1 1.7-.4 3.4 2.7 2.2-1.8 3.1-3.4-.8-2.5 2.4.6 3.4-3.3 1.3-2.1-2.8-3.4.3-1.6 3.1-3.4-1 .1-3.5-2.9-1.9-3.2 1.4-1.8-3 2.3-2.6-1-3.3-3.4-.9.3-3.5 3.4-.6 1.4-3.1-2.1-2.8 2.4-2.6 3.1 1.6 3-1.7z"
            fill="#cfd6e2"/>
      <circle cx="32" cy="32" r="7" fill="#3a4254"/>
    </symbol>

    <!-- ===== Camera-view toolbar ===== -->
    <symbol id="i-camstop" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="20" fill="#1b6fa8" stroke="#5fc2f0" stroke-width="3"/>
      <rect x="25" y="25" width="14" height="14" rx="2" fill="#eaf6ff"/>
    </symbol>
    <symbol id="i-zoomout" viewBox="0 0 64 64">
      <circle cx="28" cy="28" r="15" fill="none" stroke="#3a3a3a" stroke-width="4"/>
      <circle cx="28" cy="28" r="13" fill="#d8e8f2" opacity="0.25"/>
      <path d="M21 28h14" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
      <path d="M39 39l13 13" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
      <path d="M39 39l13 13" stroke="#3a7fb5" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-zoomin" viewBox="0 0 64 64">
      <circle cx="28" cy="28" r="15" fill="none" stroke="#3a3a3a" stroke-width="4"/>
      <circle cx="28" cy="28" r="13" fill="#d8e8f2" opacity="0.25"/>
      <path d="M21 28h14M28 21v14" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
      <path d="M39 39l13 13" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
      <path d="M39 39l13 13" stroke="#3a7fb5" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="22" fill="#2f9fe0"/>
      <path d="M42 26a12 12 0 1 0 2 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M43 18v9h-9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a4f96"/>
      <stop offset="45%" stop-color="#3d2b63"/>
      <stop offset="55%" stop-color="#2d1f4c"/>
      <stop offset="100%" stop-color="#4a3575"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e03a3a"/>
      <stop offset="35%" stop-color="#e8c53a"/>
      <stop offset="70%" stop-color="#5ec22a"/>
      <stop offset="100%" stop-color="#2f9fe0"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage-wrap">
  <div id="stage">

    <div class="clock" id="clock">00:00:00 2026/01/01</div>
    <button id="help-btn" title="Emulator help (not part of the real HMI)">?</button>

    <!-- Screens are rendered into here by js/ui.js -->
    <div id="screens"></div>

    <!-- Dialog -->
    <div class="dialog-backdrop" id="dialog-backdrop">
      <div class="dialog" id="dialog"></div>
    </div>

    <div id="toast"></div>

    <div id="power-off"><div class="msg">MACHINE OFF — CLICK TO POWER ON</div></div>
  </div>
</div>

<script src="js/profiles.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
